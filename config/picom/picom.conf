# picom v12 - compositor para Fluxbox (Intel HD 4000)
# Sin transparencia ni esquinas redondeadas.
# Ventana activa: resplandor azul Tokyo Night · ventanas sin foco: levemente oscurecidas.

# ---------- rendimiento ----------
backend = "glx";
vsync = true;
use-damage = true;              # solo redibuja lo que cambió
unredir-if-possible = true;     # video/juegos a pantalla completa sin compositor
detect-transient = true;
detect-client-opacity = true;
use-ewmh-active-win = true;     # la ventana activa la decide Fluxbox

# ---------- resplandor en la ventana activa ----------
shadow = true;
shadow-color = "#7aa2f7";
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -14;

# ---------- sin esquinas redondeadas, sin transparencia ----------
corner-radius = 0;

# ---------- sin fade (quedaba feo al maximizar/expandir) ----------
fading = false;

# ---------- reglas por ventana (formato v12) ----------
rules = (
  # ventanas sin foco: sin resplandor y un 15% más oscuras
  { match = "!focused"; shadow = false; dim = 0.15; },

  # menús, rofi y popups (override-redirect): nunca oscurecer
  { match = "override_redirect"; dim = 0; },

  # pantalla completa: nada de efectos
  { match = "fullscreen"; shadow = false; dim = 0; },

  # maximizada: sin resplandor (se desbordaba al otro monitor al expandir)
  { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; shadow = false; },

  # escritorio, toolbar, conky y notificaciones: nunca oscurecer ni sombra
  { match = "class_g = 'Conky' || class_g = 'fluxbox' || window_type = 'dock' || window_type = 'desktop'";
    shadow = false; dim = 0; },
  { match = "window_type = 'notification' || class_g = 'Dunst'"; dim = 0; },

  # menús y tooltips: sin oscurecer
  { match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    dim = 0; shadow = false; },

  # rofi aparece al instante
  { match = "class_g = 'Rofi'"; fade = false; dim = 0; },

  # arrastrar y soltar
  { match = "window_type = 'dnd'"; shadow = false; },
)
