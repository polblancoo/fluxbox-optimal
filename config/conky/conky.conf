-- Conky básico · Tokyo Night
-- __IFACE__ lo completa install.sh con tu interfaz de red.

conky.config = {
    alignment = 'top_right',
    gap_x = 26,
    gap_y = 12,
    minimum_width = 250,
    maximum_width = 250,
    update_interval = 2,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,
    use_xft = true,
    font = 'MesloLGM Nerd Font:size=9',
    uppercase = false,
    use_spacer = 'none',
    top_name_width = 14,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = false,
    own_window_colour = '#1a1b26',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 12,
    draw_borders = false,
    draw_shades = false,
    draw_outline = false,
    draw_graph_borders = false,
    default_bar_height = 6,

    default_color = '#c0caf5',
    color1 = '#7aa2f7',
    color2 = '#565f89',
    color3 = '#bb9af7',
    color4 = '#9ece6a',
    color7 = '#7dcfff',
};

conky.text = [[
${alignc}${font MesloLGM Nerd Font:bold:size=30}${color1}${time %H:%M}${font}${color}
${alignc}${color3}${time %A %d de %B}${color}
${voffset -4}${color2}${hr 1}${color}

${font MesloLGM Nerd Font:bold:size=10}${color1}󰍛 CPU ${color}${cpu cpu0}%${font}
${color3}${cpubar cpu0 6,250}${color}
${cpugraph cpu0 28,250 7aa2f7 bb9af7 -t}

${font MesloLGM Nerd Font:bold:size=10}${color1}󰘚 RAM ${color}${mem} / ${memmax}${alignr}${memperc}%${font}
${color3}${membar 6,250}${color}

${font MesloLGM Nerd Font:bold:size=10}${color1}󰖩 Red ${color2}${addr __IFACE__}${font}${color}
${color4}↓${color} ${downspeed __IFACE__}${alignr}${color7}↑${color} ${upspeed __IFACE__}

${font MesloLGM Nerd Font:bold:size=10}${color1}󰋊 Disco ${color}${fs_used /} / ${fs_size /}${alignr}${fs_used_perc /}%${font}
${color3}${fs_bar 6,250 /}${color}

${font MesloLGM Nerd Font:bold:size=10}${color1}󰔟 TOP CPU${font}${color}
${color2}${top name 1}${color}${alignr}${top cpu 1}%
${color2}${top name 2}${color}${alignr}${top cpu 2}%
${color2}${top name 3}${color}${alignr}${top cpu 3}%
]];
