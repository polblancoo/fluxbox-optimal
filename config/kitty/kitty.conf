# kitty · fluxbox-optimal
font_family       MesloLGM Nerd Font Mono
font_size         12.0

remember_window_size  yes
window_margin_width   10
window_padding_width  8
confirm_os_window_close 0

# Logo (Tux) abajo a la derecha, semitransparente. @HOME@ lo completa install.sh
window_logo_path     @HOME@/.config/kitty/logo.png
window_logo_position bottom-right
window_logo_alpha    0.6

# Pestañas estilo powerline abajo
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
active_tab_font_style bold-italic

clipboard_control write-clipboard read-clipboard
notify_on_cmd_finish invisible

# Pestañas y layouts
map ctrl+t         new_tab
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab
map ctrl+alt+1     goto_tab 1
map ctrl+alt+2     goto_tab 2
map ctrl+alt+z     toggle_layout stack
map kitty_mod+l    next_layout

# Hints (marca con letras lo que hay en pantalla)
open_url_with xdg-open
map kitty_mod+e open_url_with_hints
map kitty_mod+g kitten hints --type=linenum --linenum-action=tab nvim +{line} {path}
map kitty_mod+y kitten hints --type=word --program @

include current-theme.conf
